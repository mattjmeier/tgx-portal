x-backend-environment: &backend-environment
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DATABASE_NAME: ${DATABASE_NAME:-tgx_portal}
  DATABASE_USER: ${DATABASE_USER:-tgx_portal}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  STUDY_ARCHIVE_ROOT: /data
  DATA_EXPORT_ROOT: /exports
  DATABASE_BACKUP_ROOT: /backups
  DATABASE_BACKUP_AGE_RECIPIENT: ${DATABASE_BACKUP_AGE_RECIPIENT:-}
  DATABASE_BACKUP_AGE_IDENTITY: ${DATABASE_BACKUP_AGE_IDENTITY:-}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-tgx_portal}
      POSTGRES_USER: ${DATABASE_USER:-tgx_portal}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-tgx_portal} -d ${DATABASE_NAME:-tgx_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment: *backend-environment
    volumes:
      - ${STUDY_ARCHIVE_HOST_PATH:?STUDY_ARCHIVE_HOST_PATH is required}:/data:ro
      - ${DATABASE_BACKUP_HOST_PATH:?DATABASE_BACKUP_HOST_PATH is required}:/backups:ro
      - ${DATA_EXPORT_HOST_PATH:?DATA_EXPORT_HOST_PATH is required}:/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment: *backend-environment
    volumes:
      - ${STUDY_ARCHIVE_HOST_PATH:?STUDY_ARCHIVE_HOST_PATH is required}:/data:ro
      - ${DATABASE_BACKUP_HOST_PATH:?DATABASE_BACKUP_HOST_PATH is required}:/backups
      - ${DATA_EXPORT_HOST_PATH:?DATA_EXPORT_HOST_PATH is required}:/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  backup:
    profiles: ["ops"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py database_backup
    environment: *backend-environment
    volumes:
      - ${STUDY_ARCHIVE_HOST_PATH:?STUDY_ARCHIVE_HOST_PATH is required}:/data:ro
      - ${DATABASE_BACKUP_HOST_PATH:?DATABASE_BACKUP_HOST_PATH is required}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
