services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tgx_portal
      POSTGRES_USER: tgx_portal
      POSTGRES_PASSWORD: tgx_portal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgx_portal -d tgx_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "63179:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
      python manage.py bootstrap_dev_user &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,.devtunnels.ms
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://*.devtunnels.ms
      DATABASE_NAME: tgx_portal
      DATABASE_USER: tgx_portal
      DATABASE_PASSWORD: tgx_portal
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
      PLANE_API_BASE_URL: ${PLANE_API_BASE_URL:-http://host.docker.internal}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID:-}
      PLANE_WEB_BASE_URL: ${PLANE_WEB_BASE_URL:-http://localhost}
      TGX_PORTAL_BASE_URL: ${TGX_PORTAL_BASE_URL:-http://localhost:5173}
      STUDY_ARCHIVE_ROOT: /data
      DATA_EXPORT_ROOT: /exports
      DATABASE_BACKUP_ROOT: /backups
      DATABASE_BACKUP_AGE_RECIPIENT: ${DATABASE_BACKUP_AGE_RECIPIENT:-}
      DATABASE_BACKUP_AGE_IDENTITY: ${DATABASE_BACKUP_AGE_IDENTITY:-}
    volumes:
      - ./backend:/app
      - ${STUDY_ARCHIVE_HOST_PATH:-./data}:/data:ro
      - ${DATA_EXPORT_HOST_PATH:-./exports}:/exports
      - ${DATABASE_BACKUP_HOST_PATH:-./backups}:/backups:ro
    ports:
      - "8003:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,.devtunnels.ms
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://*.devtunnels.ms
      DATABASE_NAME: tgx_portal
      DATABASE_USER: tgx_portal
      DATABASE_PASSWORD: tgx_portal
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
      PLANE_API_BASE_URL: ${PLANE_API_BASE_URL:-http://host.docker.internal}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID:-}
      PLANE_WEB_BASE_URL: ${PLANE_WEB_BASE_URL:-http://localhost}
      TGX_PORTAL_BASE_URL: ${TGX_PORTAL_BASE_URL:-http://localhost:5173}
      STUDY_ARCHIVE_ROOT: /data
      DATA_EXPORT_ROOT: /exports
      DATABASE_BACKUP_ROOT: /backups
      DATABASE_BACKUP_AGE_RECIPIENT: ${DATABASE_BACKUP_AGE_RECIPIENT:-}
      DATABASE_BACKUP_AGE_IDENTITY: ${DATABASE_BACKUP_AGE_IDENTITY:-}
    volumes:
      - ./backend:/app
      - ${STUDY_ARCHIVE_HOST_PATH:-./data}:/data:ro
      - ${DATA_EXPORT_HOST_PATH:-./exports}:/exports
      - ${DATABASE_BACKUP_HOST_PATH:-./backups}:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  backup:
    profiles: ["ops"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py database_backup
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_NAME: tgx_portal
      DATABASE_USER: tgx_portal
      DATABASE_PASSWORD: tgx_portal
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STUDY_ARCHIVE_ROOT: /data
      DATABASE_BACKUP_ROOT: /backups
      DATABASE_BACKUP_AGE_RECIPIENT: ${DATABASE_BACKUP_AGE_RECIPIENT:-}
      DATABASE_BACKUP_AGE_IDENTITY: ${DATABASE_BACKUP_AGE_IDENTITY:-}
    volumes:
      - ${STUDY_ARCHIVE_HOST_PATH:-./data}:/data:ro
      - ${DATABASE_BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  dev-proxy:
    image: nginx:1.27-alpine
    ports:
      - "5173:5173"
    volumes:
      - ./dev/nginx/dev-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:
